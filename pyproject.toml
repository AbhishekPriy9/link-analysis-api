[project]
name = "link-analysis-api"
version = "0.1.0"
description = "FastAPI service that analyses a website with Gemini and returns structured business insights."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.164.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "google-genai==3.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
